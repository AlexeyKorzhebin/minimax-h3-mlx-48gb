# Studio API (spec 2026-10-10 §4.2–4.3). The old panel's compose.yaml is not touched; this file is
# its own compose project: docker compose -f compose.studio.yaml up -d
name: h3-studio
services:
  studio-api:
    build:
      context: .
      dockerfile: Dockerfile.studio
    image: h3-studio:latest
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    init: true
    mem_limit: 4g
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/studio/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    environment:
      TZ: Europe/Moscow
      HOME: /tmp
      H3_OUTDIR: /home/alex/Outputs
      # Host names the studio answers to besides alex-neuro/localhost/127.0.0.1 (R26): the LAN IP
      STUDIO_ALLOWED_HOSTS: "192.168.100.50"
      STUDIO_ENV_FILE: /run/secrets/studio.env
    volumes:
      - /home/alex/Outputs/studio:/home/alex/Outputs/studio
      # The LLM token: the old panel's .env, read-only, one file, outside the data folder (a bind
      # mount into it left docker's empty root-owned mount point there). Never copied, never in
      # the image (.dockerignore); llm.py reads the path from STUDIO_ENV_FILE.
      - /home/alex/Outputs/h3-panel/.env:/run/secrets/studio.env:ro
  # Slice S2 (plan 2026-10-22): the task loop. Same image; host network for the dispatcher
  # (127.0.0.1:8790) and the studio's ComfyUI (127.0.0.1:8189); ComfyUI's output folder read-only —
  # the worker copies a result into the studio's own tree and never writes there.
# Stopping it under a task normally ends in SIGKILL after stop_grace_period (40 s): it does not wait
# for the task. Nothing is lost — `recover()` at the next start follows the task on (§8.5).
  studio-worker:
    image: h3-studio:latest
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    command: ["worker"]
    depends_on:
      - studio-api
    environment:
      TZ: Europe/Moscow
      HOME: /tmp
      H3_OUTDIR: /home/alex/Outputs
    volumes:
      - /home/alex/Outputs/studio:/home/alex/Outputs/studio
      - /home/alex/Outputs/comfy-h3:/home/alex/Outputs/comfy-h3:ro
